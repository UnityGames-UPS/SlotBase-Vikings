name: Auto Merge dev-build into prod

on:
  pull_request:
    branches:
      - prod
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  auto-merge:
    # Fix: Allow job to run on PRs from dev-build to prod, or manually via workflow_dispatch
    if: >
      (github.event_name == 'pull_request' &&
       github.base_ref == 'prod' &&
       github.head_ref == 'dev-build') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Debug Event Info
        run: |
          echo "Event:      ${{ github.event_name }}"
          echo "Base ref:   ${{ github.base_ref }}"
          echo "Head ref:   ${{ github.head_ref }}"
          echo "Ref:        ${{ github.ref }}"
          echo "SHA:        ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/UnityGames-UPS/SlotBase-Vikings.git

      - name: Fetch branches
        run: |
          git fetch origin prod
          git fetch origin dev-build

      - name: Checkout prod
        run: git checkout prod

      - name: Merge dev-build into prod (prefer theirs)
        run: |
          git merge origin/dev-build -X theirs --no-edit

      - name: Push merged changes
        run: git push origin prod
