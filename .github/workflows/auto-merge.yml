name: Auto Merge dev-build into prod

on:
  pull_request:
    branches:
      - prod
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    if: github.base_ref == 'prod' && github.head_ref == 'dev-build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/UnityGames-UPS/SlotBase-Vikings.git

      - name: Fetch branches
        run: |
          git fetch origin prod
          git fetch origin dev-build

      - name: Checkout prod
        run: git checkout prod

      - name: Merge dev-build into prod (prefer theirs)
        run: |
          git merge origin/dev-build -X theirs --no-edit || true

      - name: Push merged changes
        run: |
          git push origin prod

