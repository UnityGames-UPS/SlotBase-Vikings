name: Auto Merge any branch into any branch

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to merge from"
        required: false
        default: "dev-build"
      target_branch:
        description: "Branch to merge into"
        required: false
        default: "prod"

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Event Info
        run: |
          echo "Event:      ${{ github.event_name }}"
          echo "Source:     ${{ github.event.inputs.source_branch }}"
          echo "Target:     ${{ github.event.inputs.target_branch }}"
          echo "Ref:        ${{ github.ref }}"
          echo "SHA:        ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/UnityGames-UPS/SlotBase-Vikings.git

      - name: Fetch branches
        run: |
          git fetch origin ${{ github.event.inputs.target_branch }}
          git fetch origin ${{ github.event.inputs.source_branch }}

      - name: Checkout target branch
        run: git checkout ${{ github.event.inputs.target_branch }}

      - name: Merge source branch into target branch (prefer theirs)
        run: |
          git merge origin/${{ github.event.inputs.source_branch }} -X theirs --no-edit

      - name: Push merged changes
        run: git push origin ${{ github.event.inputs.target_branch }}
