name: Auto Merge any branch into any branch

on:
  pull_request:
    branches:
      - prod
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to merge from'
        required: false
        default: 'dev-build'
      target_branch:
        description: 'Branch to merge into'
        required: false
        default: 'prod'

jobs:
  auto-merge:
    if: >
      (github.event_name == 'pull_request' &&
       github.base_ref == 'prod' &&
       github.head_ref == 'dev-build') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Debug Event Info
        run: |
          echo "Event:      ${{ github.event_name }}"
          echo "Base ref:   ${{ github.base_ref || github.event.inputs.target_branch }}"
          echo "Head ref:   ${{ github.head_ref || github.event.inputs.source_branch }}"
          echo "Ref:        ${{ github.ref }}"
          echo "SHA:        ${{ github.sha }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/UnityGames-UPS/SlotBase-Vikings.git

      - name: Fetch branches
        run: |
          git fetch origin ${{ github.event.inputs.target_branch || 'prod' }}
          git fetch origin ${{ github.event.inputs.source_branch || 'dev-build' }}

      - name: Checkout target branch
        run: git checkout ${{ github.event.inputs.target_branch || 'prod' }}

      - name: Merge source branch into target branch (prefer theirs)
        run: |
          git merge origin/${{ github.event.inputs.source_branch || 'dev-build' }} -X theirs --no-edit

      - name: Push merged changes
        run: git push origin ${{ github.event.inputs.target_branch || 'prod' }}
